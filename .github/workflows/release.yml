name: Release and publish GPU worker

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, for example 0.4.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: volleyball-analysis-engine
      - uses: actions/checkout@v4
        with:
          repository: henry753951/volleyball-monitoring-ai
          token: ${{ secrets.CENTRAL_REPO_TOKEN }}
          ref: main
          path: volleyball-monitoring-ai
      - name: Validate version
        shell: bash
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must match X.Y.Z" >&2
            exit 1
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/henry753951/volleyball-analysis-engine
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest
            type=sha
      - name: Build and publish H100 worker image
        uses: docker/build-push-action@v6
        with:
          context: volleyball-analysis-engine
          file: volleyball-analysis-engine/Dockerfile
          build-contexts: |
            central=volleyball-monitoring-ai
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=analysis-worker
          cache-to: type=gha,mode=max,scope=analysis-worker
          provenance: mode=max
          sbom: true
