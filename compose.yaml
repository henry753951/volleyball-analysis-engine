services:
  analysis-worker:
    build:
      context: .
      additional_contexts:
        central: ../volleyball-monitoring-ai
    env_file:
      - path: .env
        required: false
    environment:
      VOLLYAI_SERVER_WS_URL: ${VOLLYAI_SERVER_WS_URL:-ws://host.docker.internal:4000/api/v1/ai/providers/ws}
      VOLLYAI_WORKSPACE: /workspaces
      VOLLYAI_DEVICE: ${VOLLYAI_DEVICE:-cpu}
      VOLLYAI_RTV4_BACKEND: ${VOLLYAI_RTV4_BACKEND:-rolling}
      VOLLYAI_DETECTOR_STRIDE: ${VOLLYAI_DETECTOR_STRIDE:-12}
      VOLLYAI_REID_EVERY: ${VOLLYAI_REID_EVERY:-6}
      VOLLYAI_COURT_MODEL: ${VOLLYAI_COURT_MODEL:-v1}
      VOLLYAI_COURT_IMGSZ: ${VOLLYAI_COURT_IMGSZ:-640}
      VOLLYAI_COURT_BATCH_SIZE: ${VOLLYAI_COURT_BATCH_SIZE:-1}
      VOLLYAI_COURT_LAYOUT_EVERY: ${VOLLYAI_COURT_LAYOUT_EVERY:-10}
      VOLLYAI_COURT_REFRESH_EVERY: ${VOLLYAI_COURT_REFRESH_EVERY:-120}
      VOLLYAI_COURT_TRACK_EVERY: ${VOLLYAI_COURT_TRACK_EVERY:-4}
      VOLLYAI_COURT_MAX_HOLD_FRAMES: ${VOLLYAI_COURT_MAX_HOLD_FRAMES:-30}
      VOLLYAI_COURT_DECODER: ${VOLLYAI_COURT_DECODER:-cuda}
      VOLLYAI_PREWARM_MODELS: ${VOLLYAI_PREWARM_MODELS:-true}
      VOLLYAI_WRITE_DEBUG_ARTIFACTS: ${VOLLYAI_WRITE_DEBUG_ARTIFACTS:-false}
      VOLLYAI_RTV4_ROOT: /models/rtv4
      VOLLYAI_RTV4_CONFIG: /models/rtv4/configs/rtv4/rtv4_x3d_volleyball_v4a_decoupled.yml
      VOLLYAI_RTV4_CHECKPOINT: /models/checkpoints/best_stg1.pth
      VOLLYAI_SMP_ROOT: /models/smp
      VOLLYAI_OSNET_CHECKPOINT: /models/smp/selective_mask_propagation/osnet/checkpoints/sports_model.pth.tar-60
    volumes:
      - ${VOLLYAI_RTV4_HOST_ROOT:?Set VOLLYAI_RTV4_HOST_ROOT to the extracted RT-DETRv4 source}:/models/rtv4:ro
      - ${VOLLYAI_RTV4_CHECKPOINT_HOST:?Set VOLLYAI_RTV4_CHECKPOINT_HOST}:/models/checkpoints/best_stg1.pth:ro
      - ${VOLLYAI_SMP_HOST_ROOT:?Set VOLLYAI_SMP_HOST_ROOT}:/models/smp:ro
      - analysis-workspaces:/workspaces
      - model-cache:/root/.cache
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  analysis-workspaces:
  model-cache:
