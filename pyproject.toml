[project]
name = "volleyball-analysis-engine"
version = "0.8.0"
description = "Outbound AI worker for volleyball-monitoring-ai"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2.0",
  "opencv-python>=4.11.0.86,<5",
  "orjson>=3.10.15",
  "pydantic-settings>=2.10.0",
  "scipy>=1.15.0",
  "volley-court-lines==0.3.0",
  "volleyball-monitoring-ai-sdk",
]

[project.optional-dependencies]
cpu = [
  "torch>=2.11.0",
  "torchvision>=0.26.0",
]
cu130 = [
  "torch>=2.11.0",
  "torchvision>=0.26.0",
]
dev = [
  "pyright>=1.1.403",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
]
models = [
  "calflops>=0.3.2",
  "continual-inference>=1.2.4",
  "faster-coco-eval>=1.6.5",
  "fvcore>=0.1.5",
  "iopath>=0.1.10",
  "pillow>=11.0.0",
  "pytorchvideo>=0.1.5",
  "pyyaml>=6.0.2",
  "tensorboard>=2.20.0",
  "transformers>=4.55.0",
  "ultralytics>=8.3.0,<9",
]

[project.scripts]
volleyball-analysis = "volleyball_analysis_engine.cli:main"
volleyball-analysis-worker = "volleyball_analysis_engine.cli:worker_main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu130" },
  ],
]

[tool.uv.sources]
volleyball-monitoring-ai-sdk = { path = "../volleyball-monitoring-ai/sdk" }
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
]
volley-court-lines = { url = "https://assets.hsulab.net/packages/volley-court-lines/v0.3.0/volley_court_lines-0.3.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213", "PLR0913", "TC001", "TC002", "TC003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D103", "FBT003", "PLR2004", "S101"]
"src/volleyball_analysis_engine/artifacts.py" = ["C901", "EM101", "EM102", "TRY003"]
"src/volleyball_analysis_engine/cli.py" = ["EM101", "EM102", "T201", "TRY003"]
