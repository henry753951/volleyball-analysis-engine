services:
  analysis-worker:
    build:
      context: .
      additional_contexts:
        central: ../volleyball-monitoring-ai
    env_file:
      - path: .env
        required: false
    environment:
      VOLLYAI_SERVER_WS_URL: ${VOLLYAI_SERVER_WS_URL:-ws://host.docker.internal:4000/api/v1/ai/providers/ws}
      VOLLYAI_WORKSPACE: /workspaces
      VOLLYAI_DEVICE: ${VOLLYAI_DEVICE:-cpu}
      VOLLYAI_MULTITASK_SDK_ROOT: /models/volleyball-sdk
      VOLLYAI_MULTITASK_CHECKPOINT: /models/volleyball-sdk/best.pth
      VOLLYAI_MULTITASK_BATCH_SIZE: ${VOLLYAI_MULTITASK_BATCH_SIZE:-4}
      VOLLYAI_MULTITASK_FP16: ${VOLLYAI_MULTITASK_FP16:-true}
      VOLLYAI_MULTITASK_WARMUP: ${VOLLYAI_MULTITASK_WARMUP:-true}
      VOLLYAI_REID_EVERY: ${VOLLYAI_REID_EVERY:-1}
      VOLLYAI_PREWARM_MODELS: ${VOLLYAI_PREWARM_MODELS:-true}
      VOLLYAI_WRITE_DEBUG_ARTIFACTS: ${VOLLYAI_WRITE_DEBUG_ARTIFACTS:-false}
      VOLLYAI_SMP_ROOT: /models/smp
      VOLLYAI_OSNET_CHECKPOINT: /models/smp/selective_mask_propagation/osnet/checkpoints/sports_model.pth.tar-60
    volumes:
      - ${VOLLYAI_MULTITASK_SDK_HOST_ROOT:?Set VOLLYAI_MULTITASK_SDK_HOST_ROOT to volleyball_inference_sdk}:/models/volleyball-sdk:ro
      - ${VOLLYAI_SMP_HOST_ROOT:?Set VOLLYAI_SMP_HOST_ROOT}:/models/smp:ro
      - analysis-workspaces:/workspaces
      - model-cache:/root/.cache
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  analysis-workspaces:
  model-cache:
